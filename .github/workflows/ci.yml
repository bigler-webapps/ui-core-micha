name: CI

on: workflow_dispatch

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.15.0

      - name: Install dependencies (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
